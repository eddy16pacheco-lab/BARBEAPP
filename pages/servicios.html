<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarbApp | Servicios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        /* Grid de servicios */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Tarjeta de servicio */
        .service-card {
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.2);
        }

        /* Imagen como fondo */
        .service-img {
            width: 100%;
            height: 220px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.4s;
        }
        .service-card:hover .service-img {
            transform: scale(1.05);
        }

        /* Información */
        .service-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .service-info h3 {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .service-info p {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .service-info p i {
            color: #ffd700;
            margin-right: 5px;
        }
        .service-info .price {
            display: block;
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        /* Botón reservar */
        .btn-book {
            background: #ffd700;
            color: #111;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: auto;
        }
        .btn-book:hover {
            background: #e6c200;
            transform: scale(1.03);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1 onclick="window.location.href='../index.html'">BarbApp</h1>
        </div>
        <nav class="nav-links" id="navLinks">
            <a href="../index.html">Inicio</a>
            <a href="servicios.html" class="active">Servicios</a>
            <a href="reservas.html">Reservar</a>
            <a href="promociones.html">Promociones</a>
            <a href="fidelizacion.html">Mi Lealtad</a>
        </nav>
        <div class="auth-buttons">
            <button class="btn-login" onclick="window.location.href='login.html'">
                <i class="fas fa-user"></i> Iniciar Sesión
            </button>
        </div>
        <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <section class="section">
        <h2 class="section-title">Nuestros Servicios</h2>
        <p style="text-align: center; color: #b0b0b0; margin-bottom: 3rem;">
            Descubre todos los servicios que tenemos para ti
        </p>

        <div class="services-grid" id="allServices"></div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>BarbApp</h3>
                <p>La mejor experiencia en barbería.</p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2025 BarbApp. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const services = [
                {
                    id: 1,
                    name: 'Corte Clásico',
                    description: 'Corte de cabello tradicional con acabado perfecto',
                    price: 15,
                    duration: 30,
                    image: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=600&q=80'
                },
                {
                    id: 2,
                    name: 'Corte + Barba',
                    description: 'Servicio completo de corte y arreglo de barba',
                    price: 25,
                    duration: 45,
                    image: 'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=600&q=80'
                },
                {
                    id: 3,
                    name: 'Afeitado Profesional',
                    description: 'Afeitado con toalla caliente y productos premium',
                    price: 20,
                    duration: 30,
                    image: 'https://images.unsplash.com/photo-1517832606299-7ae9b720a186?w=600&q=80'
                },
                {
                    id: 4,
                    name: 'Corte Infantil',
                    description: 'Corte especial para los más pequeños',
                    price: 12,
                    duration: 25,
                    image: 'https://images.unsplash.com/photo-1634302086887-13b5585a8831?w=600&q=80'
                },
                {
                    id: 5,
                    name: 'Tratamiento Capilar',
                    description: 'Hidratación y cuidado para tu cabello',
                    price: 30,
                    duration: 40,
                    image: 'https://images.unsplash.com/photo-1562322140-8baeececf3df?w=600&q=80'
                },
                {
                    id: 6,
                    name: 'Tinte y Estilo',
                    description: 'Cambia tu look con nuestros expertos',
                    price: 45,
                    duration: 60,
                image: 'https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=600&q=80'}
            ];

            const container = document.getElementById('allServices');
            container.innerHTML = services.map(service => `
                <div class="service-card">
                    <div class="service-img" style="background-image: url('${service.image}')"></div>
                    <div class="service-info">
                        <h3>${service.name}</h3>
                        <p>${service.description}</p>
                        <p><i class="far fa-clock"></i> ${service.duration} minutos</p>
                        <span class="price">$${service.price}</span>
                        <button class="btn-book" onclick="selectService(${service.id})">
                            Reservar Ahora
                        </button>
                    </div>
                </div>
            `).join('');
        });

        // Función para seleccionar servicio y redirigir a reservas
        function selectService(id) {
            // Guardar el servicio seleccionado en localStorage
            localStorage.setItem('selectedService', id);
            // Redirigir a la página de reservas
            window.location.href = 'reservas.html';
        }
    </script>
</body>
</html>
